# Big Tabbed Dock (Big WindowMaker): reinicia o dock se ele cair, sem tocar a
# sessão. Os aplicativos abertos pelo dock vão para escopos próprios do
# systemd (app-big\x2dwm\x2dtabbed\x2ddock-*.scope); KillMode=process é a
# garantia extra de que parar o dock nunca fecha um aplicativo.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2
KillMode=process
# O gerador do autostart usa ExitType=cgroup: a unidade fica "ativa"
# enquanto houver qualquer processo no cgroup, e um aplicativo aberto pelo
# dock deixa ali os filhos que criou antes de ir para o escopo dele (os
# zygotes do VSCodium, 2026-11-10). O dock morto nunca era religado. Com
# ExitType=main vale o processo do dock.
ExitType=main
